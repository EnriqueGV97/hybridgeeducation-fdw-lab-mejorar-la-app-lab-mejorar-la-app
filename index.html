<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HybridgeFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">HybridgeFlix</h1>

        <form id="formularioPelicula" class="mb-6">
            <div class="mb-4">
                <label class="block font-bold mb-2">Título</label>
                <input type="text" id="titulo" class="w-full border rounded px-3 py-2" required>
            </div>

            <div class="mb-4">
                <label class="block font-bold mb-2">Año</label>
                <input type="number" id="anio" class="w-full border rounded px-3 py-2" required>
            </div>

            <div class="mb-4">
                <label class="block font-bold mb-2">Calificación (1-10)</label>
                <input type="number" id="calificacion" min="1" max="10" class="w-full border rounded px-3 py-2" required>
            </div>

            <div class="mb-4">
                <label class="block font-bold mb-2">Reseña</label>
                <textarea id="resena" class="w-full border rounded px-3 py-2" rows="3" required></textarea>
            </div>

            <!-- NUEVO CAMPO -->
            <div class="mb-4">
                <label class="block font-bold mb-2">URL del Póster</label>
                <input type="url" id="poster" class="w-full border rounded px-3 py-2" required>
            </div>

            <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">
                Guardar
            </button>
        </form>

        <table class="min-w-full bg-white">
            <thead>
                <tr>
                    <th class="border-b px-4 py-2">Poster</th>
                    <th class="border-b px-4 py-2">Título</th>
                    <th class="border-b px-4 py-2">Año</th>
                    <th class="border-b px-4 py-2">Calificación</th>
                    <th class="border-b px-4 py-2">Reseña</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaPeliculas"></tbody>
        </table>
    </div>

    <script>
        document.getElementById('formularioPelicula').addEventListener('submit', function(e) {
            e.preventDefault();

            const titulo = tituloInput.value;
            const anio = anioInput.value;
            const calificacion = calificacionInput.value;
            const resena = resenaInput.value;
            const poster = posterInput.value;

            const fila = document.createElement('tr');

            fila.innerHTML = `
                <td class="border px-4 py-2">
                    <img src="${poster}" alt="Poster" class="w-20 h-auto rounded">
                </td>
                <td class="border px-4 py-2">${titulo}</td>
                <td class="border px-4 py-2">${anio}</td>
                <td class="border px-4 py-2">${calificacion}</td>
                <td class="border px-4 py-2">${resena}</td>
            `;

            document.getElementById('cuerpoTablaPeliculas').appendChild(fila);
            this.reset();
        });

        const tituloInput = document.getElementById('titulo');
        const anioInput = document.getElementById('anio');
        const calificacionInput = document.getElementById('calificacion');
        const resenaInput = document.getElementById('resena');
        const posterInput = document.getElementById('poster');
    </script>
</body>
</html>
